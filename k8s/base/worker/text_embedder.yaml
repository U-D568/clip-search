apiVersion: apps/v1
kind: Deployment
metadata:
  name: text-embedder
  namespace: clip-search
  labels:
    app: text-embedder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: text-embedder
  template:
    metadata:
      labels:
        app: text-embedder
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: device
                    operator: In
                    values:
                      - gpu
      containers:
        - name: worker
          image: docker.io/library/clip-search:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: WORKER_TYPE
              value: GPU
            - name: BROKER_URL
              valueFrom:
                configMapKeyRef:
                  name: config
                  key: BROKER_URL
            - name: MARIADB_URL
              valueFrom:
                configMapKeyRef:
                  name: config
                  key: MARIADB_URL
            - name: QDRANT_IP
              valueFrom:
                configMapKeyRef:
                  name: config
                  key: QDRANT_IP
          command:
            - celery
            - -A
            - app.tasks.worker.celery_app
            - worker
            - -Q
            - text_queue
            - --concurrency=1
            - --loglevel=info
          volumeMounts:
            - name: test
              mountPath: /app
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: test
          hostPath:
            path: /home/d568/develop/clip-search/backend